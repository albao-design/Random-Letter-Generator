<!DOCTYPE html>
<!-- When you upload new versions of style.css, fonts.js or script.js, raise the ?v= number below (e.g. v=3 → v=4) so browsers fetch the fresh files. -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#111111">
    <title>Random Letter Generator</title>
    <meta name="description" content="Create expressive typography with mixed fonts and animations">
    
    <!-- P5.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    
    <!-- Our custom styles -->
    <link rel="stylesheet" href="style.css?v=10">
    
    <!-- Preload key fonts for better performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>
    <div class="app-container">
        <div class="controls-panel">
            <header>
                <div class="header-top">
                    <h1 data-i18n="title">Random Letter Generator</h1>
                    <div class="lang-toggle" role="group" aria-label="Language" data-i18n-aria="language">
                        <button type="button" class="lang-btn active" data-lang="en" aria-pressed="true" lang="en">EN</button>
                        <button type="button" class="lang-btn" data-lang="es" aria-pressed="false" lang="es">ES</button>
                    </div>
                </div>
                <p data-i18n="subtitle">Create expressive typography with mixed fonts and effects</p>
            </header>
            
            <!-- TEXT INPUT SECTION -->
            <div class="input-section">
                <div class="label-row">
                    <label for="textInput" data-i18n="yourMessage">Your Message</label>
                    <div class="char-counter" id="charCounter" aria-live="polite">
                        <span id="charCount">0</span> / 30
                    </div>
                </div>
                <textarea 
                    id="textInput" 
                    placeholder="Enter your message..." 
                    data-i18n-placeholder="placeholder"
                    maxlength="30"
                    rows="2"
                    autocomplete="off"
                    spellcheck="false"
                    aria-describedby="charCounter"
                ></textarea>
                <button id="generateBtn" type="button" data-i18n="generate">Generate</button>
            </div>
            
            <!-- TEXT EFFECTS SECTION -->
            <div class="collapsible-section">
                <div class="section-header" id="effectsHeader">
                    <h3 data-i18n="textEffects">Text Effects</h3>
                    <svg class="chevron" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
                        <path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                
                <div class="section-content" id="effectsContent">
                    <div class="control-group">
                        <label for="blur">
                            <span data-i18n="blur">Blur</span>
                            <span class="range-value" id="blurValue">0px</span>
                        </label>
                        <input type="range" id="blur" min="0" max="10" value="0" step="0.5" aria-describedby="blurValue">
                    </div>
                    
                    <div class="control-group">
                        <label for="spacing">
                            <span data-i18n="spacing">Spacing</span>
                            <span class="range-value" id="spacingValue">6px</span>
                        </label>
                        <input type="range" id="spacing" min="-30" max="60" value="6" step="1" aria-describedby="spacingValue">
                    </div>
                    
                    <div class="control-group">
                        <label for="stretch">
                            <span data-i18n="stretch">Stretch</span>
                            <span class="range-value" id="stretchValue">100%</span>
                        </label>
                        <input type="range" id="stretch" min="50" max="300" value="100" step="5" aria-describedby="stretchValue">
                    </div>
                    
                    <div class="control-group">
                        <label for="size">
                            <span data-i18n="size">Size</span>
                            <span class="range-value" id="sizeValue">64px</span>
                        </label>
                        <input type="range" id="size" min="20" max="160" value="64" step="2" aria-describedby="sizeValue">
                    </div>
                    
                    <div class="control-group">
                        <label for="strokeWeight">
                            <span data-i18n="strokeWeight">Stroke Weight</span>
                            <span class="range-value" id="strokeWeightValue">0px</span>
                        </label>
                        <input type="range" id="strokeWeight" min="0" max="8" value="0" step="0.5" aria-describedby="strokeWeightValue">
                    </div>
                    
                    <div class="control-group">
                        <label for="tilt">
                            <span data-i18n="tilt">Tilt</span>
                            <span class="range-value" id="tiltValue">0°</span>
                        </label>
                        <input type="range" id="tilt" min="0" max="30" value="0" step="1" aria-describedby="tiltValue">
                    </div>
                </div>
            </div>
            
            <!-- ANIMATIONS SECTION -->
            <div class="collapsible-section">
                <div class="section-header" id="animationsHeader">
                    <h3 data-i18n="animations">Animations</h3>
                    <svg class="chevron" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
                        <path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                
                <div class="section-content" id="animationsContent">
                    <div class="control-group">
                        <label for="animationType" data-i18n="animationType">Animation Type</label>
                        <select id="animationType" class="animation-select">
                            <option value="none" data-i18n="animNone">None</option>
                            <option value="bounce" data-i18n="animBounce">Bounce</option>
                            <option value="chaos" data-i18n="animChaos">Chaos</option>
                            <option value="float" data-i18n="animFloat">Float</option>
                            <option value="pulse" data-i18n="animPulse">Pulse</option>
                            <option value="typewriter" data-i18n="animTypewriter">Typewriter</option>
                            <option value="shuffle" data-i18n="animShuffle">Shuffle</option>
                        </select>
                    </div>
                    
                    <div class="control-group">
                        <label for="animationSpeed">
                            <span data-i18n="speed">Speed</span>
                            <span class="range-value" id="animationSpeedValue">1x</span>
                        </label>
                        <input type="range" id="animationSpeed" min="0.1" max="3" value="1" step="0.1" aria-describedby="animationSpeedValue">
                    </div>
                    
                    <div class="animation-controls">
                        <button id="playBtn" class="animation-btn" type="button" aria-label="Play animation" data-i18n-aria="playAria">
                            <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true" style="vertical-align: -1px; margin-right: 4px;"><path d="M2 1l7 4-7 4z" fill="currentColor"/></svg><span data-i18n="play">Play</span>
                        </button>
                        <button id="stopBtn" class="animation-btn" type="button" aria-label="Stop animation" data-i18n-aria="stopAria">
                            <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true" style="vertical-align: -1px; margin-right: 4px;"><rect x="1.5" y="1.5" width="7" height="7" fill="currentColor"/></svg><span data-i18n="stop">Stop</span>
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- EXPORT SECTION -->
            <div class="collapsible-section">
                <div class="section-header" id="exportHeader">
                    <h3 data-i18n="export">Export</h3>
                    <svg class="chevron" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
                        <path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                
                <div class="section-content" id="exportContent">
                    <div class="export-buttons">
                        <button id="exportPngBtn" class="export-btn" type="button" disabled data-i18n="downloadPng">Download PNG</button>
                        <button id="exportMp4Btn" class="export-btn" type="button" disabled>Download MP4</button>
                    </div>
                    <label class="checkbox-row" for="invertColors">
                        <input type="checkbox" id="invertColors">
                        <span data-i18n="invert">Invert (white on black)</span>
                    </label>
                    <label class="checkbox-row" for="transparentBg">
                        <input type="checkbox" id="transparentBg">
                        <span data-i18n="transparent">Transparent background (green screen for MP4)</span>
                    </label>
                    <p class="export-status" id="exportStatus" aria-live="polite"></p>
                </div>
            </div>
        </div>
        
        <!-- CANVAS CONTAINER -->
        <div class="canvas-container">
            <div id="p5-container" role="img" aria-label="Generated letters display" data-i18n-aria="canvasAria"></div>
            
            <!-- Loading indicator -->
            <div id="loadingIndicator" class="loading" style="display: none;">
                <span data-i18n="loadingFonts">Loading fonts…</span>
            </div>
        </div>
    </div>
    
    <!-- Error messages container -->
    <div id="errorContainer" style="display: none;" role="alert">
        <p id="errorMessage" class="error-message"></p>
    </div>
    
    <!-- Load our scripts -->
    <!-- Packs video frames into an MP4 file -->
    <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/build/mp4-muxer.js"></script>
    <script src="fonts.js?v=10"></script>
    <script src="translations.js?v=10"></script>
    <script src="script.js?v=10"></script>
    
    <!-- Service Worker for offline capabilities (optional) -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sw.js')
                    .then(function(registration) {
                        console.log('ServiceWorker registration successful');
                    })
                    .catch(function(err) {
                        console.log('ServiceWorker registration failed');
                    });
            });
        }
    </script>
</body>
</html>
